<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c17" />
    <meta name="color-scheme" content="light dark" />
    <script id="appearance-init">
      // Apply appearance before the first paint, including when storage is blocked.
      (function () {
        var preference = 'system';
        try {
          var saved = JSON.parse(localStorage.getItem('prototype-crpt:appearance') || 'null');
          if (saved === 'light' || saved === 'dark' || saved === 'system') preference = saved;
        } catch (_) {}
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = preference === 'system' ? (dark ? 'dark' : 'light') : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.appearance = preference;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0b0c17' : '#edf0f8');
      })();
    </script>
    <meta name="description" content="A quieter view of global markets. Track cryptocurrencies and world currencies in Mongolian tögrög with prototype crpt." />
    <title>prototype crpt — Global markets, closer to home.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
